<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>CommSchool</title>
</head>
<body>
    <section class="section-container">
        <div class="section-div">
            <img src="./public/assets/LOGO.svg" alt=""/>
            <img id="bg" src="./public/assets/leftbg.png" alt=""/>
            <img id="cover" src="./public/assets/cover.png" alt="" />
            <div class="form-container">
                <div class="heading-container">
                    <h1>Login with Lorem</h1>
                    <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry.</p>
                </div>
                <label for="username" class="input-label">User Name</label>
                <input name="username" id="username" class="text-input" placeholder="Type your username here"/>
                <label for="password" class="input-label">Enter your password</label>
                <input name="password" class="text-input" id="password" placeholder="Type your password here"/>
                <div class="extras-container">
                    <div>
                        <input type="checkbox" id="remember" name="remember" />
                        <label for="remember"> Remember me?</label>
                    </div>
                    <span>Forgot Password?</span>
                </div>
                <button>Login</button>
            </div>
        </div>
    </section>
</body>
</html>
