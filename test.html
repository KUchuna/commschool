<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table, th, tr, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    th, td {
      padding: 5px 10px;
    }
    .table-header {
      background-color: rgb(150, 5, 5);
      color: white;
      cursor: pointer;
    }

    .table-header:hover {
      background-color: rgb(71, 5, 5);
    }

    form {
      margin-bottom: 30px;
    }

  </style>
</head>
<body>
  <form id="personForm">
    <input type="text" id="firstName" placeholder="First Name" required />
    <input type="text" id="lastName" placeholder="Last Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <select id="gender" required>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <button type="submit">Add Person</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th data-sort="first_name" class="table-header">First Name</th>
        <th data-sort="last_name" class="table-header">Last Name</th>
        <th data-sort="email" class="table-header">Email</th>
        <th data-sort="gender" class="table-header">Gender</th>
        <th></th>
      </tr>
    </thead>
    <tbody>

    </tbody>
  </table>

  <script src="./data.js"></script>
  <script src="./exercise.js"></script> 
</body>
</html>
